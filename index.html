<!DOCTYPE html>
<html lang="en" dir="ltr" translate="no" class="notranslate">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#23211f">
<title>Forka Procurement</title>
<link rel="icon" href="logos/forka-procurement-icon.svg" type="image/svg+xml"><link rel="icon" href="logos/forka-procurement-icon.png" type="image/png" sizes="64x64"><link rel="apple-touch-icon" href="logos/forka-procurement-touch.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=EB+Garamond:wght@500;600&family=Inter+Tight:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --fk-charcoal:#23211f;--fk-charcoal-dark:#171513;--fk-charcoal-soft:#3a3631;
  --fk-paper:#f6f3ee;--fk-card:#fffdf9;--fk-line:#e5dfd5;
  --fk-bronze:#9a6b3f;--fk-bronze-hover:#86592f;--fk-bronze-light:#b8875a;--fk-bronze-soft:#e9dccb;
  --fk-text:#23211f;--fk-text-2:#5c5852;--fk-muted:#8d877e;
  --fk-success:#4f7a3a;--fk-success-bg:#eef3e8;--fk-warning:#a8731c;--fk-warning-bg:#fbf2e2;
  --fk-danger:#a33a2c;--fk-danger-bg:#f8e9e5;--fk-info:#3e5c8a;--fk-info-bg:#eaeff6;
  --fk-radius:14px;--fk-radius-sm:10px;
  --fk-sans:'Inter Tight','IBM Plex Sans Arabic',system-ui,sans-serif;
  --fk-serif:'EB Garamond','IBM Plex Sans Arabic',serif;
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:var(--fk-sans);background:var(--fk-paper);color:var(--fk-text);font-size:14px;font-feature-settings:"tnum" 1;line-height:1.45}
[dir=rtl] body{font-family:'IBM Plex Sans Arabic','Inter Tight',system-ui,sans-serif}
h1,h2,h3{font-family:var(--fk-serif);font-weight:600;margin:0}
[dir=rtl] h1,[dir=rtl] h2{font-family:'IBM Plex Sans Arabic',serif}
.top{background:var(--fk-charcoal);color:#fff;padding:12px 24px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;position:sticky;top:0;z-index:6}
.logo{font-family:var(--fk-serif);font-weight:600;font-size:22px;letter-spacing:2.5px;text-transform:uppercase;white-space:nowrap}
.top .sub{color:#b9b2a6;font-size:12px}
.tabs{display:flex;gap:2px;margin-inline-start:12px}
.tab{border:0;background:none;color:#d9d3c9;font-family:inherit;font-size:14px;padding:9px 12px;border-radius:10px;cursor:pointer;border-bottom:3px solid transparent;min-height:40px}
.tab:hover{color:#fff;background:rgba(255,255,255,.05)}
.tab.on{color:#fff;font-weight:600;background:rgba(184,135,90,.16);border-bottom-color:var(--fk-bronze-light)}
.sp{flex:1}
.lang{display:flex;gap:3px;background:rgba(255,255,255,.07);border-radius:999px;padding:3px}
.lang button{border:0;background:none;color:#d9d3c9;border-radius:999px;padding:6px 12px;cursor:pointer;font-family:inherit;font-weight:600}
.lang button.on{background:var(--fk-bronze-light);color:#fff}
.page{padding:20px 24px 60px;display:flex;flex-direction:column;gap:14px;max-width:1500px;margin:0 auto}
.card{background:var(--fk-card);border:1px solid var(--fk-line);border-radius:var(--fk-radius);padding:16px 18px}
.card h2{font-size:20px;margin-bottom:8px}
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(auto-fit,minmax(180px,1fr))}
.stat .lbl{color:var(--fk-text-2);font-size:12px;font-weight:600}
.stat .num{font-weight:600;font-size:28px;letter-spacing:-.5px;margin-top:2px}
.stat .num small{font-size:13px;color:var(--fk-muted);font-weight:500;margin-inline-start:4px}
.stat .hint{color:var(--fk-muted);font-size:12px}
.banner{border-radius:var(--fk-radius-sm);padding:10px 14px;font-size:13px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.bn-ok{background:var(--fk-success-bg);color:var(--fk-success)}.bn-warn{background:var(--fk-warning-bg);color:var(--fk-warning)}.bn-info{background:var(--fk-info-bg);color:var(--fk-info)}
.prog{display:flex;height:10px;border-radius:999px;overflow:hidden;background:var(--fk-paper);margin:10px 0 8px}
.prog i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:13px}
.legend span{display:inline-flex;align-items:center;gap:6px;cursor:pointer}
.legend b{font-weight:700}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.badge{display:inline-block;border-radius:999px;font-weight:600;font-size:11px;padding:2px 9px;white-space:nowrap}
.b-ok{background:var(--fk-success-bg);color:var(--fk-success)}.b-warn{background:var(--fk-warning-bg);color:var(--fk-warning)}
.b-bad{background:var(--fk-danger-bg);color:var(--fk-danger)}.b-mute{background:var(--fk-paper);color:var(--fk-muted)}
.b-pemo{background:var(--fk-bronze-soft);color:var(--fk-bronze-hover)}
.btn{font-family:var(--fk-sans);font-weight:600;border-radius:var(--fk-radius-sm);border:1.5px solid var(--fk-line);background:var(--fk-card);color:var(--fk-text);padding:7px 13px;cursor:pointer;min-height:36px;font-size:13px}
.btn:hover{border-color:var(--fk-bronze);color:var(--fk-bronze)}
.btn-primary{background:var(--fk-charcoal);border-color:var(--fk-charcoal);color:#fff}.btn-primary:hover{background:var(--fk-bronze);border-color:var(--fk-bronze);color:#fff}
.btn-accent{background:var(--fk-bronze);border-color:var(--fk-bronze);color:#fff}.btn-accent:hover{background:var(--fk-bronze-hover);color:#fff}
.btn:disabled{opacity:.45;cursor:not-allowed}
input.chg,select.chg{border-color:var(--fk-bronze);background:#f7efe4;box-shadow:0 0 0 2px rgba(154,107,63,.18)}
input:disabled,select:disabled{opacity:1;color:var(--fk-text);background:transparent;border-color:transparent;-webkit-appearance:none;appearance:none}
input.miss:disabled,select.miss:disabled{background:var(--fk-danger-bg);border-color:var(--fk-danger)}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px 12px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld input,.fld select{width:100%}
h3.sec{font-family:var(--fk-sans);font-size:15px;font-weight:600;margin:0 0 12px}
[dir=rtl] h3.sec{font-family:'IBM Plex Sans Arabic',sans-serif}
tr.sup-row:hover td{background:#f7f1e8}
.chip:disabled{cursor:default;opacity:.85}
.btn-ok{min-height:30px;padding:3px 10px;font-size:12px}
.btn-ok.done{background:var(--fk-success-bg);border-color:var(--fk-success-bg);color:var(--fk-success)}
input,select,textarea{font-family:var(--fk-sans);background:var(--fk-card);border:1.5px solid var(--fk-line);border-radius:var(--fk-radius-sm);color:var(--fk-text);padding:6px 9px;font-size:13px;min-height:34px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--fk-bronze);box-shadow:0 0 0 3px rgba(154,107,63,.15)}
label{font-weight:600;color:var(--fk-text-2);font-size:12px}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1.5px solid var(--fk-line);background:var(--fk-card);border-radius:999px;padding:5px 12px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;color:var(--fk-text-2);min-height:32px}
.chip.on{background:var(--fk-bronze-soft);border-color:var(--fk-bronze-light);color:var(--fk-bronze-hover)}
.tbl-wrap{overflow:auto;border:1px solid var(--fk-line);border-radius:var(--fk-radius);background:var(--fk-card);max-height:72vh}
table{border-collapse:collapse;width:100%}
th,td{padding:7px 8px;text-align:start;font-size:13px;vertical-align:top}
thead th{background:var(--fk-paper);font-weight:600;border-bottom:1px solid var(--fk-line);position:sticky;top:0;z-index:2;font-size:12px;color:var(--fk-text-2);white-space:nowrap}
tbody td{border-bottom:1px solid var(--fk-line)}
td.n,th.n{text-align:end}
tr.r-miss td:first-child{box-shadow:inset 3px 0 0 var(--fk-danger)}
[dir=rtl] tr.r-miss td:first-child{box-shadow:inset -3px 0 0 var(--fk-danger)}
tr.r-ok td:first-child{box-shadow:inset 3px 0 0 var(--fk-success)}
[dir=rtl] tr.r-ok td:first-child{box-shadow:inset -3px 0 0 var(--fk-success)}
td input.num{width:82px;text-align:end}
td input.sup{width:170px}
td input.unit{width:96px}
td input.pkn{width:70px}
td select.us{min-width:96px}
td select{min-height:34px}
select.warnsel{border-color:var(--fk-warning);background:var(--fk-warning-bg)}
input.miss,select.miss{border-color:var(--fk-danger);background:var(--fk-danger-bg);color:var(--fk-danger)}
input.miss::placeholder{color:var(--fk-danger);opacity:.8}
.item{font-weight:600;min-width:200px;max-width:280px}
.item small{display:block;font-weight:400;color:var(--fk-muted);font-size:11px}
.item input{width:100%;font-weight:600}
.hint{font-size:11px;color:var(--fk-muted);margin-top:2px;white-space:nowrap}
.hint button{border:0;background:none;color:var(--fk-bronze);font-weight:600;cursor:pointer;padding:0;font-size:11px;font-family:inherit}
.who{font-size:11px;color:var(--fk-muted);margin-top:3px;white-space:nowrap}
.list .li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--fk-line)}
.list .li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.bar{height:6px;background:var(--fk-paper);border-radius:999px;overflow:hidden;margin-top:5px}
.bar i{display:block;height:100%;background:var(--fk-bronze-light)}
.two{grid-template-columns:repeat(auto-fit,minmax(380px,1fr))}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--fk-charcoal);color:#fff;padding:10px 18px;border-radius:999px;font-weight:600;opacity:0;transition:.2s;pointer-events:none;z-index:9}
.toast.show{opacity:1}
.empty{color:var(--fk-muted);text-align:center;padding:28px}
.steps{margin:0;padding-inline-start:20px;color:var(--fk-text-2)}
.steps li{margin:6px 0}
textarea{width:100%;min-height:120px}
@media (max-width:860px){.top{padding:10px 14px}.tabs{margin:0;order:3;width:100%;overflow-x:auto}.page{padding:14px}.two{grid-template-columns:1fr}}

.side-card{padding:22px 24px}
.ops-first .side-card[data-side=ops]{order:-1}
.side-card .stat .num{font-weight:700}
.flow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px;font-size:12px;color:var(--fk-text-2)}
.flow-step{background:var(--fk-paper);border:1px solid var(--fk-line);border-radius:999px;padding:4px 12px}
.flow-step b{color:var(--fk-bronze)}
.ro{padding:8px 0;font-size:14px}
.bill{max-width:900px;margin:0 auto}
.bill-t th,.bill-t td{border-bottom:1px solid var(--fk-line)}
.bill-t tfoot td{border-bottom:0;border-top:2px solid var(--fk-text);padding-top:10px}
.sigline{border-bottom:1px solid var(--fk-text);height:44px}
@media print{#top,.no-print,#toast,.banner,body>div:first-child{display:none!important}body{background:#fff}.bill{border:0;padding:0;max-width:none}.bill-t thead th{position:static}}

/* header */
.top{display:block;padding:0}
.t1{display:flex;align-items:center;gap:18px;padding:10px 24px;min-height:56px}
.brand{display:flex;align-items:baseline;gap:12px;min-width:0}
.brand .logo{cursor:pointer}
.appname{font-weight:600;font-size:14px;color:#fff;white-space:nowrap}
.period{color:#b9b2a6;font-size:12px;white-space:nowrap}
.sidesw{display:flex;background:rgba(255,255,255,.07);border-radius:999px;padding:3px;gap:2px;margin:0}
.sidesw button{border:0;background:none;color:#d9d3c9;font-family:inherit;font-size:13px;font-weight:600;padding:6px 16px;border-radius:999px;cursor:pointer;white-space:nowrap}
.sidesw button.on{background:var(--fk-bronze);color:#fff}
.t2{display:flex;align-items:center;gap:12px;padding:0 24px;background:var(--fk-card);border-bottom:1px solid var(--fk-line);min-height:46px;flex-wrap:wrap}
.t2 .tabs{margin:0;gap:4px;flex:0 0 auto;max-width:100%;overflow-x:auto}
.t2 .tab{white-space:nowrap;color:var(--fk-text-2);font-size:13px;font-weight:500;padding:12px 10px 10px;border-radius:0;min-height:46px;border-bottom:2px solid transparent}
.t2 .tab:hover{color:var(--fk-text);background:none}
.t2 .tab.on{color:var(--fk-text);font-weight:600;background:none;border-bottom-color:var(--fk-bronze)}
.status{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:13px;color:var(--fk-text-2);padding:6px 0;margin-inline-start:auto}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st b{color:var(--fk-text)}
.st-role{color:var(--fk-muted);padding-inline-start:6px;border-inline-start:1px solid var(--fk-line);margin-inline-start:4px}
.st-muted{color:var(--fk-muted)}
.st-warn{color:var(--fk-warning)}
.st-chg{color:var(--fk-warning);font-weight:600}
.st-chg::before{content:'';width:7px;height:7px;border-radius:50%;background:var(--fk-warning);display:inline-block}
.dot-live{width:7px;height:7px;border-radius:50%;background:var(--fk-success);display:inline-block}
.btn-sm{min-height:30px;padding:4px 11px;font-size:12px}
.page{gap:16px}
.card h2{font-size:19px}
/* overview */
.ov-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(360px,1fr));gap:18px;align-items:start}
.ops-first .ov-col[class*=ov-col]:nth-child(2){order:-1}
.ov-col{background:var(--fk-card);border:1px solid var(--fk-line);border-radius:var(--fk-radius);overflow:hidden}
.ov-head{padding:20px 22px 14px;border-bottom:1px solid var(--fk-line)}
.ov-head h2{font-size:24px;margin:0 0 4px}
.ov-head p{margin:0;color:var(--fk-text-2);font-size:13px}
.ov-list{display:flex;flex-direction:column}
.ov-row{display:flex;align-items:center;gap:14px;width:100%;text-align:start;padding:14px 22px;border:0;border-bottom:1px solid var(--fk-line);background:none;font-family:inherit;color:var(--fk-text);cursor:pointer}
.ov-row:last-child{border-bottom:0}
.ov-row:hover{background:var(--fk-paper)}
.ov-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ov-t{font-weight:600;font-size:14px}
.ov-d{color:var(--fk-muted);font-size:12px;line-height:1.4}
.ov-b{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end;max-width:46%}
.ov-arrow{color:var(--fk-muted);font-size:16px;width:16px;text-align:center}
.ov-row:hover .ov-arrow{color:var(--fk-bronze)}
/* login */
.login{max-width:400px;margin:56px auto;padding:28px 28px 24px;text-align:center}
.login .logo{color:var(--fk-text);font-size:30px;margin-bottom:14px}
.login h2{font-size:21px;margin-bottom:6px}
.login form{justify-content:center;margin-top:16px}
/* movements */
.dir{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.4px;text-transform:uppercase;border-radius:4px;padding:1px 6px;margin-inline-end:4px;vertical-align:1px}
.dir-in{background:var(--fk-success-bg);color:var(--fk-success)}
.dir-out{background:var(--fk-paper);color:var(--fk-text-2);border:1px solid var(--fk-line)}
@media (max-width:1180px){.period{display:none}}
@media (max-width:860px){.t1{padding:8px 14px;gap:10px;flex-wrap:wrap}.sidesw{order:3;width:100%;justify-content:stretch}.sidesw button{flex:1;text-align:center}.t2{padding:0 14px;flex-wrap:wrap}.t2 .tabs{width:100%;overflow-x:auto}.status{width:100%;padding:8px 0 10px;border-top:1px solid var(--fk-line)}.ov-grid{grid-template-columns:1fr}.ov-b{max-width:40%}}
@media print{.t2{display:none}}
/* ===== gate (landing + PIN) ===== */
.gate{min-height:calc(100vh - 24px);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px 60px;position:relative}
.gate-lang{position:absolute;top:18px;inset-inline-end:22px;display:flex;gap:3px;background:var(--fk-card);border:1px solid var(--fk-line);border-radius:999px;padding:3px}
.gate-lang button{border:0;background:none;color:var(--fk-text-2);border-radius:999px;padding:6px 12px;cursor:pointer;font-family:inherit;font-weight:600;font-size:12px}
.gate-lang button.on{background:var(--fk-charcoal);color:#fff}
.mark{text-align:center}
.mark .w{font-family:var(--fk-serif);font-weight:600;font-size:64px;letter-spacing:12px;text-transform:uppercase;line-height:1;color:var(--fk-charcoal);padding-inline-start:12px}
.mark .rule{width:56px;height:2px;background:var(--fk-bronze);margin:18px auto 14px}
.mark .s{font-family:var(--fk-serif);font-size:22px;letter-spacing:4px;text-transform:uppercase;color:var(--fk-bronze)}
[dir=rtl] .mark .s{font-family:'IBM Plex Sans Arabic',serif;letter-spacing:0}
.gate .doors .door:last-child:nth-child(odd){grid-column:1/-1;justify-self:center}
.omhome{display:flex;flex-direction:column;align-items:center;padding:40px 16px 60px}.omhome .doors{grid-template-columns:repeat(3,250px)}@media(max-width:860px){.omhome .doors{grid-template-columns:minmax(0,300px)}}
.doors{display:grid;grid-template-columns:repeat(2,250px);gap:30px 28px;margin-top:52px;direction:ltr;justify-content:center}
@media (max-width:620px){.doors{grid-template-columns:minmax(0,300px)}}
.gate-ceo{position:absolute;top:18px;inset-inline-start:22px;border:1px solid var(--fk-line);background:var(--fk-card);color:var(--fk-text);border-radius:999px;padding:7px 18px;font-family:var(--fk-serif);font-weight:600;font-size:14px;letter-spacing:1.5px;cursor:pointer}
[dir=rtl] .gate-ceo{font-family:'IBM Plex Sans Arabic',serif;letter-spacing:0}
.gate-ceo:hover{background:var(--fk-charcoal);color:#fff;border-color:var(--fk-charcoal)}
.door{width:250px;display:flex;flex-direction:column;align-items:center;gap:12px}
.door button{width:100%;height:66px;border-radius:999px;border:1px solid var(--fk-bronze-hover);background:linear-gradient(180deg,#a87648 0%,var(--fk-bronze) 55%,var(--fk-bronze-hover) 100%);color:#fff;box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 6px 14px rgba(134,89,47,.28),0 2px 4px rgba(35,33,31,.12);transform:translateY(0);font-family:var(--fk-serif);font-size:22px;font-weight:600;letter-spacing:1.5px;cursor:pointer;transition:.15s}
[dir=rtl] .door button{font-family:'IBM Plex Sans Arabic',serif;letter-spacing:0;font-size:20px}
.door button:hover,.door button:focus-visible{transform:translateY(-2px);box-shadow:0 1px 0 rgba(255,255,255,.25) inset,0 10px 22px rgba(134,89,47,.34),0 3px 6px rgba(35,33,31,.14);outline:none}
.door button:active{transform:translateY(1px);box-shadow:0 1px 0 rgba(255,255,255,.2) inset,0 3px 8px rgba(134,89,47,.25)}
.door p{margin:0;text-align:center;color:var(--fk-muted);font-size:12.5px;line-height:1.5;max-width:230px}
[dir=rtl] .door p{direction:rtl}
.gate-foot{position:absolute;bottom:18px;color:var(--fk-muted);font-size:11px;letter-spacing:1.5px;text-transform:uppercase}
.pinbox{margin-top:44px;width:100%;max-width:340px;text-align:center}
.pinbox h2{font-size:26px;margin-bottom:6px}
.pinbox p{color:var(--fk-text-2);font-size:13px;margin:0 0 18px}
.pinbox input{width:100%;text-align:center;font-size:24px;letter-spacing:10px;height:56px;border-radius:999px;border:1.5px solid var(--fk-line)}
.pinbox input:focus{border-color:var(--fk-charcoal);box-shadow:none}
.pinbox .go{width:100%;height:52px;border-radius:999px;border:0;background:var(--fk-charcoal);color:#fff;font-family:inherit;font-size:15px;font-weight:600;margin-top:12px;cursor:pointer}
.pinbox .go:hover{background:var(--fk-bronze)}
.pinbox .back{border:0;background:none;color:var(--fk-text-2);font-family:inherit;font-size:13px;margin-top:16px;cursor:pointer}
.pinbox .back:hover{color:var(--fk-bronze)}
.pinbox .err{color:var(--fk-danger);font-size:13px;margin-top:10px;min-height:18px}
.pinbox .demo{color:var(--fk-muted);font-size:12px;margin-top:6px}
/* inside header */
.t1 .brand .logo{font-size:20px;letter-spacing:4px}
.t1 .appname{color:#d9d3c9;font-weight:500}

   The glow is a blurred copy of each leaf (an SVG filter), so it also works in Safari. */
.fk-load{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:#f6f3ee}

.fk-load .p2{animation-delay:.206s}.fk-load .p3{animation-delay:.412s}.fk-load .p4{animation-delay:.619s}

async function addMedia(id,files){const g=rec('GRN',id);const list=[...(g.media||[])];
  for(const f of files){const mid='M-'+Date.now().toString(36)+Math.random().toString(36).slice(2,5);let size=f.size,type=f.type||'';
    if(type.startsWith('image/')){try{const url=URL.createObjectURL(f);const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});const k=Math.min(1,1600/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);const d=c.toDataURL('image/jpeg',0.78);mediaMem[mid]=d;size=Math.round(d.length*0.75);type='image/jpeg';URL.revokeObjectURL(url)}catch(e){toast('✗ '+f.name);continue}}
    else if(type.startsWith('video/')){if(f.size>25*1048576){toast(t('vidBig'));continue}mediaMem[mid]=URL.createObjectURL(f)}else continue;
    list.push({id:mid,name:f.name,type,size,at:new Date().toISOString()})}
  editR('GRN',id,{media:list});render()}

let scanBusy=false,scanMsg='';
async function scanAvail(){try{const C=window.claude;if(C&&C.use){const s=await C.use('sample');if(s){const lim=s.limits?await s.limits():{images:true};if(lim&&lim.images)return {kind:'claude',s}}}}catch(_){}
  if(SHEET&&CFG.SCAN)return {kind:'sheet'};return null}
function normN(x){return String(x||'').toUpperCase().replace(/[^A-Z0-9؀-ۿ ]+/g,' ').split(/\s+/).filter(w=>w.length>1)}
const STOPW=new Set(['LLC','L','L.C','TRADING','TRD','CO','COMPANY','EST','ESTABLISHMENT','FZE','FZC','GENERAL','AND','THE','GM','G','KG','PC','PCS','PKT','BOX','BTL','LTR','ML','PACKET']);
function compact(x){return normN(x).filter(w=>!STOPW.has(w)).join('').replace(/FOODSTUFFS?/g,'FOODSTUFF').replace(/J/g,'Z')}
function simN(a,b){const A=compact(a),B=compact(b);if(!A||!B)return 0;if(A===B)return 1;const bg=s=>{const m={};for(let i=0;i<s.length-1;i++){const k=s.slice(i,i+2);m[k]=(m[k]||0)+1}return m};const x=bg(A),y=bg(B);let n=0,tx=0,ty=0;for(const k in x){tx+=x[k];if(y[k])n+=Math.min(x[k],y[k])}for(const k in y)ty+=y[k];return tx+ty?2*n/(tx+ty):0}
async function shrink(file){const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});const k=Math.min(1,1800/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);
  const d=c.toDataURL('image/jpeg',0.82);const blob=await new Promise((res,rej)=>c.toBlob(x=>x?res(x):rej(new Error('blob')),'image/jpeg',0.82));return {d,blob}}
async function scanBill(id,file){if(scanBusy)return;const av=await scanAvail();if(!av){toast(t('scanNA'));return}
  scanBusy=true;scanMsg=t('scanning');render();
  try{const {d,blob}=await shrink(file);const g=rec('GRN',id);
    const pool=lines().filter(l=>!g.sup||l.sup===g.sup);const cand=(pool.length?pool:lines()).map(l=>`${l.id} | ${l.n}`).join('\n');
    const sups=suppliers().map(x=>x.n).filter(Boolean).join('; ');
    const prompt=`You read a supplier delivery note / tax invoice photo for a restaurant group in the UAE and return JSON only.
Return: {"supplier":string|null,"invoice_no":string|null,"po_no":string|null,"dn_no":string|null,"date":"YYYY-MM-DD"|null,"lines":[{"name":string,"qty":number|null,"unit":string|null,"unit_price":number|null,"total":number|null,"match_id":string|null}],"vat":number|null,"grand_total":number|null}
Rules: copy numbers exactly as printed; unit_price excludes VAT if the bill shows both; one entry per product line; skip totals/VAT rows. For match_id pick the id of the SAME product from the list below (same product and pack size). Be strict: a different product that shares a word is NOT a match (fresh 'Lemon' is not 'Lemon salt'; 'Chicken breast' is not 'Chicken stock'). If unsure, use null — a person will pick it. supplier: pick the closest name from this list if it is clearly the same company, else the name printed: ${sups}
Our items (id | name):
${cand}`;
    let out;
    if(av.kind==='claude'){out=await av.s.json(prompt,{images:[blob],modelTier:'default'})}
    else{const r=await post({pin,scan:{mime:'image/jpeg',data:d.split(',')[1],prompt}});if(!r.ok)throw new Error(r.error||'scan');out=r.result}
    applyScan(id,out,d);scanMsg=t('scanDone')}
  catch(e){const c=e&&e.code;console.warn('scan failed',e);scanMsg=c==='not_granted'?t('scanDenied'):c==='rate_limited'?t('scanRate'):c==='image_rejected'?t('scanImg'):t('scanFail')+(c?' ('+c+')':(e&&e.message?' ('+String(e.message).slice(0,60)+')':''))}
  scanBusy=false;render()}
function applyScan(id,o,dataUrl){const g=rec('GRN',id);const patch={};o=o||{};
  if(o.invoice_no&&!g.inv)patch.inv=String(o.invoice_no);if(o.po_no&&!g.po)patch.po=String(o.po_no);if(o.dn_no&&!g.dn)patch.dn=String(o.dn_no);
  if(o.date&&/^\d{4}-\d{2}-\d{2}$/.test(o.date))patch.billDate=o.date;
  if(o.supplier&&!g.sup){const best=suppliers().map(x=>({n:x.n,s:simN(x.n,o.supplier)})).sort((a,b)=>b.s-a.s)[0];if(best&&best.s>=0.6)patch.sup=best.n;else patch.billSup=String(o.supplier)}
  const supN=patch.sup||g.sup;const all=supN?[...lines().filter(l=>l.sup===supN),...lines().filter(l=>l.sup!==supN)]:lines();const L=[...grnLines(g)];
  (o.lines||[]).forEach(x=>{const aiSaid=Object.prototype.hasOwnProperty.call(x,'match_id');let it=x.match_id?all.find(l=>l.id===x.match_id):null;let how=it?'ai':'';
    if(!it&&!aiSaid){const b=all.map(l=>({l,s:simN(l.n,x.name)})).sort((a,b)=>b.s-a.s)[0];if(b&&b.s>=0.85){it=b.l;how='name'}}
    const conf=it?simN(it.n,x.name):0;
    L.push({item:it?it.id:null,name:it?it.n:String(x.name||''),billName:String(x.name||''),u:it?it.u:(x.unit||''),ord:x.qty??null,planQ:it?calc(it).q:0,recv:null,rej:null,price:x.unit_price??(x.total&&x.qty?+(x.total/x.qty).toFixed(2):null),plan:it?(+it.p||0):0,scanned:true,matched:!!it,how,check:!!it&&conf<0.75})});
  patch.lines=L;if(o.grand_total)patch.billTotal=+o.grand_total;if(o.vat!=null)patch.billVat=+o.vat;
  const mid='M-'+Date.now().toString(36);mediaMem[mid]=dataUrl;patch.media=[...(g.media||[]),{id:mid,name:'bill.jpg',type:'image/jpeg',size:Math.round(dataUrl.length*0.75),bill:true,at:new Date().toISOString()}];
  editR('GRN',id,patch)}

// ---- payment schedule, SOA, notifications ----
function paySched(S){S=S||{};return S.payCycle||(S.terms==='credit'&&+S.days>0?'days':'delivery')}
function schedTxt(S){const c=paySched(S);if(c==='days')return `${fmt(+S.days||0)} ${t('pDays')}`;if(c==='weekly'){const d=DAYS.find(z=>z[0]===(S.payDow||'sun'));return `${t('ps_weekly')} ${d?(lang==='ar'?d[2]:d[1]):''}`}if(c==='monthly')return `${t('ps_monthly')} ${+S.payDom||1}`;return S.terms==='credit'?t('ps_delivery'):t('pCash')}
function iso(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function dueOf(S,d){S=S||{};const c=paySched(S);if(!d)return '';const base=new Date(d+'T00:00:00');if(isNaN(base))return d;
  const cr=S.terms==='credit'&&+S.days>0?+S.days:0;
  if(c==='days'){base.setDate(base.getDate()+cr);return iso(base)}
  if(c==='weekly'){base.setDate(base.getDate()+cr);const w=Math.max(0,DAYS.findIndex(z=>z[0]===(S.payDow||'sun')));while(base.getDay()!==w)base.setDate(base.getDate()+1);return iso(base)}
  if(c==='monthly'){base.setDate(base.getDate()+cr);const dom=Math.min(31,Math.max(1,+S.payDom||1));let y=base.getFullYear(),m=base.getMonth();
    const mk=(y,m)=>new Date(y,m,Math.min(dom,new Date(y,m+1,0).getDate()));let c2=mk(y,m);if(c2<base)c2=mk(y,m+1);return iso(c2)}
  return d}
function daysTo(d){const a=new Date(new Date().toISOString().slice(0,10)+'T00:00:00'),b=new Date(d+'T00:00:00');return Math.round((b-a)/864e5)}
function supAgg(){const R=payRows(),by={};R.forEach(r=>{const k=r.g.sup||'—';const a=by[k]=by[k]||{n:k,S:r.S,rows:[],billed:0,paid:0,hold:0,ready:[]};a.rows.push(r);a.billed+=r.val;if(r.st==='paid')a.paid+=r.val;else if(r.st==='hold')a.hold+=r.val;else a.ready.push(r)});
  Object.values(by).forEach(a=>{a.bal=a.billed-a.paid;const d=a.ready.map(r=>r.due).filter(Boolean).sort();a.next=d[0]||'';a.nextAmt=a.next?a.ready.filter(r=>r.due<=a.next).reduce((x,r)=>x+r.val,0):0;a.nextN=a.next?a.ready.filter(r=>r.due<=a.next).length:0});return by}
function finSeen(){return ls('pp-fin-seen')||''}
function notes(){const A=Object.values(supAgg()).filter(a=>a.next&&daysTo(a.next)<=7).sort((a,b)=>a.next.localeCompare(b.next));
  const seen=finSeen();const nw=recs('GRN').filter(g=>['received','paid'].includes(g.status)&&(g.recvAt||g.date||'')>seen);return {due:A,nw}}
function whenTxt(d){const n=daysTo(d);return n<0?`<span style="color:var(--fk-danger);font-weight:600">${-n} ${t('nDays')} ${t('nOver')}</span>`:n===0?`<b style="color:var(--fk-warning)">${t('nToday')}</b>`:`${t('nIn')} ${n} ${t('nDays')}`}

function rqGo(to,ok){const id=rqOpenId;const r=Object.assign({id},rec('Requests',id));const st=r.status||'new';
  if(to==='later'||to==='rejected'){rqClose={id,to,reason:to==='later'?'later':'',note:'',date:''};render();return}
  if(to==='reopen'&&!ok){rqAsk('cf_reopen',r,()=>rqGo('reopen',1));return}
  if(to==='reopen'){const back=r.prevStatus&&!['later','rejected'].includes(r.prevStatus)?r.prevStatus:'review';if(editR('Requests',id,{status:back,closeReason:'',closeNote:'',reviewOn:'',log:rqLog(id,'status',back)}))render();return}
  if(to==='back'){const back=st==='sourcing'?'review':st==='quotes'?'sourcing':'quotes';if(editR('Requests',id,{status:back,log:rqLog(id,'status',back)})){if(back==='review'){tab='prq'}render()}return}
  const M=rqMiss(r);
  if(to==='sourcing'&&(M.spec.length||M.buyer)){toast(t('rqFix'));render();return}
  if(to==='quotes'&&M.opt){toast(t('rqNeedOpt'));render();return}
  if(to==='approval'&&M.pick){toast(t('rqNeedPick'));render();return}
  if(to==='ordered'&&st!=='approved'){toast(t('rqNeedAppr'));return}
  if(!ok&&['review','approval','withdraw','ceook'].includes(to)){rqAsk('cf_'+to,r,()=>rqGo(to,1));return}
  if(to==='withdraw'){if(editR('Requests',id,{status:'quotes',log:rqLog(id,'status','quotes')}))render();return}
  if(to==='ceook'){const at=new Date().toISOString();if(editR('Requests',id,{status:'approved',ceo:{decision:'approved',by:me,at},log:rqLog(id,'status','approved')})){sendAlert('decision',{dec:t('dec_approved'),title:r.title});poFromRequest(id);toast(t('rqApproved'));render()}return}
  if(to==='ceoback'){rqClose={id,to:'ceoback',reason:'other',note:''};render();return}
  const patch={status:to,log:rqLog(id,'status',to)};if(to==='approval'){patch.sentCeoAt=new Date().toISOString();patch.ceo=null}if(to==='review'&&!r.buyer)patch.buyer=me;
  if(editR('Requests',id,patch)){if(to==='sourcing'){tab='pon';toast(t('rqMoved'))}if(to==='approval'){toast(t('rqSentCeo'));const o=(r.opts||[]).find(x=>x.pick)||{};sendAlert('approval',{title:r.title,sup:o.sup||'',amt:fmt((+o.price||0)*(+r.qty||1),2)})}render();window.scrollTo(0,0)}}

function docnoImg(e){const w=e.offsetWidth,h=e.offsetHeight;if(!w||!h)return;const cs=e.ownerDocument.defaultView.getComputedStyle(e),k=3,c=document.createElement('canvas');c.width=w*k;c.height=h*k;

  const im=e.ownerDocument.createElement('img');im.src=c.toDataURL();im.style.width=w+'px';im.style.height=h+'px';im.style.verticalAlign='bottom';e.textContent='';e.appendChild(im)}

async function rqPhoto(file){try{const url=URL.createObjectURL(file);const img=await new Promise((res,rej)=>{const im=new Image();im.onload=()=>res(im);im.onerror=rej;im.src=url});const k=Math.min(1,900/Math.max(img.width,img.height));const c=document.createElement('canvas');c.width=Math.round(img.width*k);c.height=Math.round(img.height*k);c.getContext('2d').drawImage(img,0,0,c.width,c.height);URL.revokeObjectURL(url);const ph=c.toDataURL('image/jpeg',0.7);let keep=ph;if(SHEET){const up=await upload_({name:file.name||'photo.jpg',type:'image/jpeg',data:ph});if(!up)return;keep=up.thumb||up.url}rqDraft.photos=[...(rqDraft.photos||[]),keep].slice(0,3);render()}catch(e){toast('✗')}}

  const pk=e.target.closest('[data-rqpick]');if(pk&&rqOpenId){const L=(rec('Requests',rqOpenId).opts||[]).map((x,i)=>Object.assign({},x,{pick:i===+pk.dataset.rqpick?!x.pick:false}));if(editR('Requests',rqOpenId,{opts:L}))render();return}

  const fx=e.target.closest('[data-rqfx]');if(fx){const F=tab==='pon'?rqG:rqF;F[fx.dataset.rqfx]=!F[fx.dataset.rqfx];render();return}
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act;
  if(a==='rqmore'){const m=tab==='pon'?'go':'in';rqMore[m]=!rqMore[m];render();return}

  else if(a==='rqaddopt'){const L=[...(rec('Requests',rqOpenId).opts||[]),{sup:'',price:null,lead:'',note:''}];if(editR('Requests',rqOpenId,{opts:L}))render()}
  else if(a==='rqmail'){const id=rqOpenId,r=rec('Requests',id);if(!r)return;const tx=((document.getElementById('rqtext')||{}).value||'').trim().slice(0,1500);
    const to=r.byEmail||((peopleList().find(p=>p.email&&String(p.name||'').trim().toLowerCase()===String(r.by||'').trim().toLowerCase())||{}).email)||'';
    const ar=lang==='ar',no=r.no||id,sub=`${no} · ${r.title||''} · ${ar?'مشتريات فوركا':'Forka Procurement'}`;
    const body=(ar?`مرحباً ${r.by||''}،\n\n`:`Hello ${r.by||''},\n\n`)+(tx?tx+'\n\n':'')+(ar?`رقم الطلب: ${no}\nالطلب: ${r.title||''}\nالحالة: ${t('rs_'+(r.status||'new'))}\n\n${me||''}\nمشتريات فوركا\nhttps://procurement.forka.com`:`Request number: ${no}\nRequest: ${r.title||''}\nStatus: ${T.en['rs_'+(r.status||'new')]||r.status||''}\n\n${me||''}\nForka Procurement\nhttps://procurement.forka.com`);
    if(editR('Requests',id,{log:rqLog(id,'mail',(to?to+' — ':'')+(tx||sub))}))render();
    if(!to)toast(t('rqMailNoTo'));
    openMail('mailto:'+encodeURIComponent(to).replace(/%40/g,'@')+'?subject='+encodeURIComponent(sub)+'&body='+encodeURIComponent(body))}
  else if(a==='rqlog'){const tx=(document.getElementById('rqtext')||{}).value||'';if(!tx.trim())return;const ty=side==='dept'?'reply':side==='ceo'?'ceo':((document.getElementById('rqlt')||{}).value||'msg');if(editR('Requests',rqOpenId,{log:rqLog(rqOpenId,ty,tx.trim().slice(0,1500))})){if(ty==='msg'){const r0=rec('Requests',rqOpenId);sendAlert('reply',{title:r0.title},r0.by)}render()}}
});

function logAct(kind,id,patch){if(SHEET)return;try{const keys=Object.keys(patch||{}).filter(k=>!['who','at','uid','log'].includes(k));let label='';
  if(kind==='Requests'||kind==='GRN'||kind==='Transfers'){const r=rec(kind,id);label=(r.no||id)+(r.title?' · '+r.title:'')+(patch.status?' → '+(t('rs_'+patch.status)!=='rs_'+patch.status?t('rs_'+patch.status):patch.status):'')}
  else if(kind==='line'){label=(line(id).n||id)}else if(kind==='sup'){label=(supRec(id).n||id)}else if(kind==='people'){label=((PEOPLE[id]||{}).name||patch.name||id)}else label=id;
  const now=Date.now(),last=Object.values(ACT).sort((a,b)=>b.at.localeCompare(a.at))[0];
  if(last&&last.by===me&&last.kind===kind&&last.ref===id&&!patch.status&&now-Date.parse(last.at)<120000){const f=[...new Set([...(last.fields||[]),...keys])].slice(0,12);pstore('activity',last.id,Object.assign({},last,{fields:f,at:new Date().toISOString(),label}),ACT);return}
  const aid='A-'+now.toString(36)+Math.random().toString(36).slice(2,5);pstore('activity',aid,{id:aid,at:new Date().toISOString(),by:me,side,kind,ref:id,label,fields:keys.slice(0,12)},ACT)}catch(e){}}

function poTot(po){const sub=(po.lines||[]).reduce((a,l)=>a+(+l.qty||0)*(+l.price||0),0);return {sub,vat:sub*0.05,tot:sub*1.05}}
function poRecvd(po){const R=(po.lines||[]).map(()=>0);recs('GRN').forEach(g=>{if(g.poId!==po.id||!['received','paid'].includes(g.status))return;grnLines(g).forEach(l=>{if(l.poLine!=null&&R[l.poLine]!=null)R[l.poLine]+=Math.max(0,(+l.recv||0)-(+l.rej||0))})});return R}
function poStatus(po){const st=po.status||'draft';if(st!=='issued')return st;const R=poRecvd(po),L=po.lines||[];if(L.length&&L.every((l,i)=>R[i]>=(+l.qty||0)-1e-9))return 'received';if(R.some(x=>x>0))return 'part';return 'issued'}
function poMiss(po){const m={need:!po.need,sup:!po.sup,lines:(po.lines||[]).map(l=>({qty:!(+l.qty>0),price:!(+l.price>0)}))};m.any=m.need||m.sup||!(po.lines||[]).length||m.lines.some(x=>x.qty||x.price);return m}

  const ok=editR('POs',id,Object.assign({no:poNo(),date:new Date().toISOString().slice(0,10),status:'draft',deliverTo:OMAN()?'oman':'ajman',cur:OMAN()?'OMR':'AED',need,notes:'',by:me},o,{need}));return ok?id:null}
function poFromRequest(rid){const r=rec('Requests',rid);if(r.poId&&rec('POs',r.poId).no)return r.poId;const o=(r.opts||[]).find(x=>x.pick)||{};const sp=r.spec||{};
  const spec=Object.keys(sp).filter(k=>k!=='notes'&&String(sp[k]||'').trim()).map(k=>sp[k]).join(', ');
  const id=poCreate({sup:o.sup||'',src:{type:'request',id:rid,no:r.no},need:r.needBy||'',deliverTo:r.branch&&r.branch!=='all'?r.branch:'ajman',apprBy:(r.ceo||{}).by||'',
    lines:[{item:null,name:(r.title||'')+(spec?' — '+spec:''),qty:+r.qty||1,unit:r.unit||'',price:+o.price||0}]});
  if(id)editR('Requests',rid,{poId:id});return id}
function poAutoRestock(){if(poAutoDone||(SHEET&&!editMode)||!me)return;poAutoDone=true;
  const open=new Set();recs('POs').forEach(po=>{if(['draft','issued','part'].includes(poStatus(po)))(po.lines||[]).forEach(l=>{if(l.item)open.add(l.item)})});
  const by={};lines().forEach(l=>{if(l.st==null||l.st===''||!l.stAt)return;if(!['below','order'].includes(stockState(l))||open.has(l.id)||!l.sup)return;const q=calc(l).q;if(!(q>0))return;(by[l.sup]=by[l.sup]||[]).push({item:l.id,name:l.n,qty:Math.ceil(q*100)/100,unit:l.u||'',price:+l.p||0})});
  let n=0;Object.entries(by).forEach(([sup,L])=>{if(poCreate({sup,src:{type:'restock'},lines:L}))n++});poAutoMsg=n?fill(t('lpAuto'),{n}):''}

(async()=>{

  try{pin=sessionStorage.getItem('pp-pin')||''}catch(_){pin=''}

  const BG=SHEET&&ERP&&!pin?post({load:true,side:''}):null, SNAPP=SHEET&&ERP?IDB.get('snap'):null;

  const s0=SNAPP?await SNAPP:null,SNAP=s0&&s0.erp===ERP&&s0.r&&s0.r.me?s0.r:null;
  // Opening from Forka Apps: one call checks the sign-in and downloads the data together (or the saved copy opens at once).
  if(BG){const r0=SNAP||await BG;if(!SNAP)keepSnap(r0);if(r0.ok){ERP_SIDES=(r0.me&&r0.me.sides)||[];if(r0.lines){PRELOAD=r0}applyMe(r0.me);if(ERP_SIDES.length===1){await erpEnter(ERP_SIDES[0])}}else if(r0.error==='erp'||r0.error==='noproc'){ERP='';try{sessionStorage.removeItem('pp-erp')}catch(_){}pin='';gateMsg=r0.error==='noproc'?t('erpNone'):t('erpExpired')}}
  let ok='';try{ok=sessionStorage.getItem('pp-ok')||''}catch(_){}

  if(SHEET&&!pin)mode='login';
  render();
  if(SHEET){
    const go=async first=>{if(!pin||mode==='login')return;try{const o=await sheetLoad(!first);if(o===SAME)return;shared=o;
        if(first){mode='live';editMode=myRole!=='viewer'}else if(myRole==='viewer')editMode=false;
        const ae=document.activeElement;if(!(ae&&ae.tagName==='INPUT'&&(ae.dataset.f||ae.dataset.sf)))render()}
      catch(e){if(e.code==='pin'){signOut(errMsg(e.err));return}if(first){mode='offline';render()}}};
    if(mode==='live'){}else if(!pin){mode='login';render()}
    else if(SNAP&&!PRELOAD){PRELOAD=SNAP;await go(true);go(false)}  // open from the saved copy, then check the server
    else{mode='loading';render();await go(true)}
    REFRESH=go;
    // Opened from the saved copy: when the server answers, check access is unchanged and pick up any changes.
    if(BG&&SNAP)BG.then(r=>{
      if(!r.ok){if(r.error==='erp'||r.error==='noproc'){erpGone();if(r.error==='noproc'){gateMsg=t('erpNone');render()}}return}
      keepSnap(r);ERP_SIDES=(r.me&&r.me.sides)||[];applyMe(r.me);
      if(unlocked&&ERP_SIDES.indexOf(unlocked)<0){erpGone();return}       // access to this section was removed
      if(r.ver!==VER){if(pin&&mode!=='login')go(false);else PRELOAD=r.lines?r:null}
      if(mode==='login')render()});
    setInterval(()=>{if(!document.hidden)go(false)},30000);
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)go(false)});return}
  const timer=setTimeout(()=>{if(mode==='loading'){mode='offline';render()}},10000);
  try{
    let C=window.claude;for(let i=0;i<30&&!(C&&C.use);i++){await new Promise(r=>setTimeout(r,100));C=window.claude}
    db=C&&C.use?await C.use('db'):null;user=C&&C.use?await C.use('user'):null;    if(user){try{isOwner=!!(await user.isOwner())}catch(_){}try{uid=await user.id()}catch(_){}}
    let canW=null;if(user){try{canW=await user.can('data.write')}catch(_){canW=null}}
    if(!db){clearTimeout(timer);mode='local';render();return}
    if(canW===false){mode='local'}

    [['oman_suppliers',o=>{supShared=o}],['oman_lines',o=>{shared=o}]].forEach(([c,f])=>db.collection(c).onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});inRegion('oman',()=>f(o));render()},()=>{}));
    [['GRN','oman_grn'],['POs','oman_pos']].forEach(([k,c])=>db.collection(c).onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});inRegion('oman',()=>{recShared[k]=o});render()},()=>{}));
    db.collection('suppliers').onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});inRegion('uae',()=>{supShared=o});const ae=document.activeElement;if(!(ae&&ae.tagName==='INPUT'&&(ae.dataset.f||ae.dataset.sf)))render()},()=>{});
    [['GRN','grn'],['Evaluations','evaluations'],['Deliveries','deliveries'],['Transfers','transfers'],['Requests','requests'],['POs','pos']].forEach(([k,c])=>db.collection(c).onSnapshot(sn=>{const o={};sn.docs.forEach(d=>{if(d.exists)o[d.id]=d.data()});inRegion('uae',()=>{recShared[k]=o});const ae=document.activeElement;if(!(ae&&(ae.tagName==='INPUT'||ae.tagName==='SELECT')&&(ae.dataset.tl||ae.dataset.tk||ae.dataset.rf||ae.dataset.gl!==undefined)))render()},()=>{}));
    db.collection('lines').onSnapshot(snap=>{const o={};snap.docs.forEach(d=>{if(d.exists&&!/^(G|E|D|T|R|PO)-[0-9a-z]+$/.test(d.id))o[d.id]=d.data()});inRegion('uae',()=>{shared=o});
        if(!snap.metadata.fromCache){clearTimeout(timer);if(mode==='loading'||mode==='offline')mode=canW===false?'local':'live';

  }catch(e){clearTimeout(timer);mode='local';render()}
})();
